      const {data,error}=await SB.auth.signUp({email:e,password:pw,options:{data:{name:nm,phone:ph,ref:getRef()}}});
      if(error)setf("auth",error.message);
      else if(data.session){S.sess=data.session;setf("auth");await load();return}
      else{
        const r=await SB.auth.signInWithPassword({email:e,password:pw});
        if(r.data&&r.data.session){S.sess=r.data.session;setf("auth");await load();return}
        setf("auth","Cuenta creada. Toca “Ya tengo cuenta” e inicia sesión.");
      }
    }else{

    }

  });

  return`<div class="card"><div class="row"><b>${N(x.frz)} FRZ</b><span class="tag ${x.status}">${stTxt(x.status)}</span></div><div class="row"><span class="code" style="font-size:18px">${esc(x.code)}</span><button class="cp" data-c="${esc(x.code)}">Copiar</button></div><div class="mu">${x.owner_id?"Comprada por "+esc(own.name||own.email||""):"Creada por el admin"}${x.note?" · "+esc(x.note):""}<br>${fmt(x.created_at)}${x.redeemed_by?"<br>Canjeada por "+esc(red.name||red.email||"")+" · "+fmt(x.redeemed_at):""}</div>${x.status==="disponible"?`<button class="no" data-void="${x.id}" style="margin-top:8px;padding:8px 12px">Anular</button>`:""}</div>`;
}
const qOk=s=>!S.q||s.toLowerCase().includes(S.q.toLowerCase());
const stOk=x=>S.fs==="all"||(S.fs==="pend"&&(x.status==="pendiente"||x.status==="espera"))||(S.fs==="ok"&&x.status==="aceptado")||(S.fs==="no"&&x.status==="rechazado");
function fbar(st){
  return`<input id="aq" placeholder="🔍 Buscar..." value="${esc(S.q)}">`+(st?`<div class="row" style="gap:4px;margin:6px 0">${[["all","Todos"],["pend","Pendientes"],["ok","Aceptados"],["no","Rechazados"]].map(([k,l])=>`<button class="${S.fs===k?"":"alt"}" data-fs="${k}" style="flex:1;padding:8px 0;font-size:12px">${l}</button>`).join("")}</div>`:"");
}
function tags(c){return`${c.admin?'<span class="tag proc">ADMIN</span> ':""}${c.reseller?'<span class="tag aceptado">REVENDEDOR</span> ':""}${!c.verified?'<span class="tag espera">SIN VERIFICAR</span> ':""}${c.banned?'<span class="tag rechazado">BANEADO</span>':""}`}
function adminList(){
  if(S.asub==="clientes"){
    const cl=S.clients.filter(c=>c.id!==S.sess.user.id&&qOk([c.name,c.email,c.phone].join(" "))).sort((a,b)=>(a.verified?1:0)-(b.verified?1:0));
    return cl.map(c=>`<div class="card row"><div><b>${esc(c.name||"(sin nombre)")}</b> ${tags(c)}<div class="mu">${esc(c.email)}${c.phone?" · "+esc(c.phone):""}<br>${N(c.balance)} FRZ · ${c.orders_count} pedidos</div></div><button data-v="${c.id}">Ver</button></div>`).join("")||`<p class="mu">Sin resultados.</p>`;
  }
  if(S.asub==="recargas"){
    const l=S.deps.filter(x=>stOk(x)&&qOk([cm(x.user_id).name,x.email,x.phone,x.ff_id,x.ref,x.item,x.game,x.frz].join(" "))).sort((a,b)=>(a.status==="pendiente"?0:1)-(b.status==="pendiente"?0:1));
    return l.map(depCard).join("")||`<p class="mu">Sin resultados.</p>`;
  }
  const l=S.orders.filter(x=>stOk(x)&&qOk([cm(x.user_id).name,x.email,x.ff_id,x.item,x.game].join(" ")));
  return l.map(ordCard).join("")||`<p class="mu">Sin resultados.</p>`;
}
function ventas(){
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d7=new Date(now-7*864e5),d30=new Date(now.getFullYear(),now.getMonth(),1);
  const acc=S.deps.filter(x=>x.status==="aceptado"),ords=S.orders.filter(o=>o.status==="aceptado");
  return`<div class="card bonus"><div class="mu">Se cuenta por la fecha en que el cliente envió el pago o el pedido. Solo pagos y pedidos aceptados.</div></div>`+[["Hoy",d0],["Últimos 7 días",d7],["Este mes",d30]].map(([t,d])=>{
    const a=acc.filter(x=>new Date(x.created_at)>=d),o=ords.filter(x=>new Date(x.created_at)>=d);
    const sum=m=>a.filter(x=>mOf(x)===m).reduce((s,x)=>s+priceOf(x),0);
    return`<div class="card"><b>${t}</b><div class="row"><span class="mu">📱 Saldo</span><b>${N(sum("saldo"))} saldo</b></div><div class="row"><span class="mu">🏦 Transferencia</span><b>${N(sum("banco"))} CUP</b></div><div class="row"><span class="mu">💲 USDT</span><b>${N(sum("usdt"))} USDT</b></div><hr><div class="row"><span class="mu">Recargas directas entregadas</span><b>${a.filter(x=>x.kind==="directo").length}</b></div><div class="row"><span class="mu">Pedidos por créditos</span><b>${o.length}</b></div><div class="row"><span class="mu">Créditos recargados</span><b>${N(a.filter(x=>x.kind==="credito").reduce((s,x)=>s+(+x.frz||0),0))} FRZ</b></div></div>`;
  }).join("");
}
function topv(){
  const r=S.clients.filter(c=>c.reseller||+c.sold>0).sort((a,b)=>b.sold-a.sold);
  return`<div class="card bonus"><div class="mu">Ranking por FRZ que cada revendedor ha transferido a otros usuarios desde la web.</div></div>`+(r.length?r.map((c,i)=>`<div class="card row"><div><b>${i+1}. ${esc(c.name||c.email)}</b> ${c.reseller?'<span class="tag aceptado">REVENDEDOR</span>':""}<div class="mu">${esc(c.email)}</div></div><b>${N(c.sold)} FRZ</b></div>`).join(""):`<p class="mu">Aún no hay ventas de revendedores.</p>`);
}
function precios(){
  const rows=[["rate_saldo","1 FRZ en saldo"],["rate_banco","1 FRZ en CUP"],["rate_usdt","1 FRZ en USDT"]];
  return`<div class="card bonus"><div class="mu">Precio del crédito para todos. Los precios de Recarga Directa se editan en cada oferta, en la pestaña Juegos. Un revendedor puede tener precios propios en su ficha.</div></div>`+rows.map(([k,l])=>`<label class="mu">${l}</label><input data-pk="${k}" type="number" step="any" min="0.01" value="${P[k]}">`).join("")+fe("price")+`<button id="psave" style="width:100%;margin-top:8px">Guardar precios</button>`;
}

    h+=`<div class="card"><div class="row"><b>${esc(g.icon)} ${esc(g.name)}</b>${g.active?'<span class="tag aceptado">ACTIVO</span>':'<span class="tag rechazado">OCULTO</span>'}</div><input data-gf="${g.id}:name" value="${esc(g.name)}" placeholder="Nombre"><input data-gf="${g.id}:icon" value="${esc(g.icon)}" placeholder="Emoji"><input data-gf="${g.id}:id_label" value="${esc(g.id_label)}" placeholder="Qué pide el cliente"><div class="row"><button class="alt" data-gsave="${g.id}">Guardar</button><button class="alt" data-gtog="${g.id}">${g.active?"Ocultar":"Mostrar"}</button><button class="no" data-gdel="${g.id}">Borrar</button></div>`;

    });

  });

function admin(){
  if(!S.adm)return`<h2>Administración</h2><div class="card"><label>Contraseña de administrador</label><input id="apw" type="password" placeholder="Contraseña">${fe("gate")}<button id="unlock" style="width:100%">Entrar</button></div>`;
  const cl=S.clients.filter(c=>!c.admin),w=S.orders.filter(o=>o.status==="espera"),dpn=S.deps.filter(x=>x.status==="pendiente"),nvf=cl.filter(c=>!c.verified).length;
  let h=`<div class="card ${S.open?"":"lose"}"><div class="row"><div><b>Estado de la web</b><div class="mu">${S.open?"🟢 Encendida: los clientes pueden usarla":"🔴 Apagada: solo los administradores pueden entrar"}</div></div><button class="${S.open?"no":"ok"}" id="tog">${S.open?"Apagar web":"Encender web"}</button></div>${fe("tog")}</div>`;
  h+=`<div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><div class="mu">Clientes</div><div class="big" style="font-size:26px">${cl.length}</div></div><div><div class="mu">Sin verificar</div><div class="big" style="font-size:26px">${nvf}</div></div><div><div class="mu">Pedidos</div><div class="big" style="font-size:26px">${w.length}</div></div><div><div class="mu">Recargas</div><div class="big" style="font-size:26px">${dpn.length}</div></div></div>${fe("adm")}`;
  h+=`<div class="row" style="gap:4px;margin-bottom:10px;flex-wrap:wrap">${[["clientes","Clientes"],["recargas","Recargas"],["pedidos","Pedidos"],["ventas","Ventas"],["top","Top"],["juegos","Juegos"],["precios","Precios"],["frz","FRZ"],["gift","Gift"]].map(([k,l])=>`<button class="${S.asub===k?"":"alt"}" data-s="${k}" style="flex:1 1 18%;padding:10px 0;font-size:12px">${l}</button>`).join("")}</div>`;
  if(S.asub==="clientes")h+=S.selc?detail():fbar(false)+`<div id="alist">${adminList()}</div>`;
  if(S.asub==="recargas"||S.asub==="pedidos")h+=fbar(true)+`<div id="alist">${adminList()}</div>`;
  if(S.asub==="ventas")h+=ventas();
  if(S.asub==="top")h+=topv();
  if(S.asub==="juegos")h+=juegos();
  if(S.asub==="precios")h+=precios();
  if(S.asub==="frz")h+=`<div class="card"><div class="mu">Tu billetera</div><div class="big">∞ FRZ</div></div><h2>Enviar</h2><div class="card"><input id="aem" type="email" placeholder="Correo del cliente"><input id="aam" type="number" step="any" min="0.01" placeholder="Cantidad FRZ">${fe("send")}<button id="send" style="width:100%">Enviar</button></div><h2>Quitar FRZ</h2><div class="card"><input id="rem" type="email" placeholder="Correo del cliente"><input id="ram" type="number" step="any" min="0.01" placeholder="Cantidad FRZ a quitar">${fe("rmv")}<button class="no" id="rmv" style="width:100%">Quitar</button></div>`;
  if(S.asub==="gift"){
    h+=`<div class="card gift"><b>Gift cards infinitas</b><div class="mu">Crea las que quieras, gratis. Cada código se puede canjear una sola vez.</div></div><div class="card"><input id="gam" type="number" step="any" min="0.01" placeholder="Valor en FRZ" value="${esc(S.f.gam||"")}"><input id="gqty" type="number" min="1" max="50" placeholder="Cantidad (1 a 50)" value="${esc(S.f.gqty||"1")}"><input id="gnote" maxlength="80" placeholder="Nota (opcional)" value="${esc(S.f.gnote||"")}">${fe("gnew")}<button id="gcreate" style="width:100%">Crear gift cards</button></div>`;
    if(S.newCodes.length)h+=`<div class="card win"><div class="t" style="font-size:20px">Códigos creados</div>${S.newCodes.map(c=>`<div class="row"><span class="code" style="font-size:18px">${esc(c)}</span><button class="cp" data-c="${esc(c)}">Copiar</button></div>`).join("")}<button class="cp" data-c="${esc(S.newCodes.join("\n"))}" style="margin-top:8px">Copiar todos</button></div>`;
    h+=`<h2>Todas las gift cards (${S.cards.length})</h2>`+(S.cards.length?S.cards.map(cardAdmin).join(""):`<p class="mu">Aún no hay gift cards.</p>`);
  }
  return h;
}

on class="cp" data-c="${esc(t.pw)}" style="margin-top:8px">Copiar</button>${c.phone?`<a class="abtn" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(waNum(c.phone))}?text=${encodeURIComponent("Tu nueva contraseña temporal de FIRE Zone Recargas es: "+t.pw+" . Entra y cámbiala en Billetera.")}">Enviar por WhatsApp</a>`:""}</div>`:""}<h2>Enviar mensaje</h2><div class="card"><input id="nmsg" placeholder="Mensaje para el cliente">${fe("note")}<button id="nsend" data-u="${c.id}" style="width:100%">Enviar mensaje</button></div><h2>Pedidos del cliente</h2>`+(os.length?os.map(mini).join(""):`<p class="mu">Sin pedidos.</p>`);

const gv=sel=>{const e=$(sel);return e?e.value:""};
const rpcDo=async(fn,args,key)=>{const {error}=await SB.rpc(fn,args);setf(key,error?clean(error.message):"");await loadSettings();await load()};
function bind(){
  const g=(s,fn)=>{const e=$(s);if(e)e.onclick=fn};
  const all=(s,fn)=>document.querySelectorAll(s).forEach(fn);
  g("#out",()=>SB.auth.signOut());
  g("#recheck",()=>load());
  g("#npush",()=>{try{Notification.requestPermission().then(()=>render())}catch(e){}});
  g("#faqb",()=>{S.faq=true;render();window.scrollTo(0,0)});
  g("#faqback",()=>{S.faq=false;render()});
  g("#movb",()=>{S.mov=true;render();window.scrollTo(0,0)});
  g("#mback",()=>{S.mov=false;render()});
  g("#cpb",()=>{S.cp=!S.cp;S.f={};render()});
  g("#rsb",()=>{S.rs=!S.rs;S.f={};render()});
  g("#rssend",async()=>{
    const em=gv("#rse").trim(),am=parseFloat(gv("#rsa"));
    if(!em||!(am>0)){setf("rs","Escribe el correo y la cantidad.");return render()}
    const {error}=await SB.rpc("reseller_send",{p_email:em,p_amount:am});
    if(error){setf("rs",clean(error.message));return render()}
    S.rs=false;setf("wal","",`✅ Enviaste ${N(am)} FRZ a ${em}.`);await load();
  });
  g("#cpsave",async()=>{
    const v=gv("#np");
    if(v.length<6){setf("cp","La contraseña debe tener 6 o más caracteres.");return render()}
    const {error}=await SB.auth.updateUser({password:v});
    if(error)setf("cp",error.message);else{S.cp=false;setf("wal","","✅ Contraseña cambiada.")}
    render();
  });
  /* juegos y ofertas (cliente) */
  all("[data-g]",b=>b.onclick=()=>{S.game=+b.dataset.g;S.method=null;S.sel=null;S.dr=null;S.f={};render()});
  g("#back",()=>{S.game=null;S.method=null;render()});
  g("#mdir",()=>{S.method="directo";S.dr=null;S.f={};render()});
  g("#mcre",()=>{S.method="creditos";S.sel=null;S.f={};render()});
  g("#backm",()=>{S.method=null;S.sel=null;S.dr=null;S.f={};render()});
  g("#back2",()=>{S.sel=null;S.f={};render()});
  all("[data-o]",b=>b.onclick=()=>{S.sel=+b.dataset.o;S.f={};render()});
  g("#pay",async()=>{
    const ff=gv("#ffid").trim();
    if(ff.length<3||ff.length>60){setf("pay","Escribe un dato válido (de 3 a 60 caracteres).");return render()}
    const {error}=await SB.rpc("place_order",{p_offer:S.sel,p_ff:ff});
    if(error){setf("pay",clean(error.message));return render()}
    S.tab="pedidos";resetNav();await load();
  });
  /* recarga directa */
  all("[data-dm]",b=>b.onclick=()=>{S.dm=b.dataset.dm;render()});
  all("[data-dsel]",b=>b.onclick=()=>{S.dr={sel:+b.dataset.dsel,step:1,ff:"",phone:"",ref:"",proof:"",busy:false};S.f={};render()});
  g("#drback",()=>{S.dr=null;S.f={};render()});
  g("#drnext",()=>{
    const v=gv("#drid").trim();S.dr.ff=v;
    if(v.length<3||v.length>60){setf("dr","Escribe un dato válido (de 3 a 60 caracteres).");return render()}
    S.dr.step=2;S.f={};render();window.scrollTo(0,0);
  });
  g("#dredit",()=>{S.dr.step=1;render()});
  wire("dr",()=>S.dr);
  g("#drsend",async()=>{
    const r=S.dr,m=S.dm;if(!checkPay(m,r,"dr"))return;
    r.busy=true;render();
    const {error}=await SB.rpc("create_direct",{p_offer:r.sel,p_ff:r.ff,p_phone:m==="usdt"?"":r.phone,p_proof:r.proof,p_method:m,p_ref:r.ref||""});
    if(error){r.busy=false;setf("dr",clean(error.message));return render()}
    S.tab="pedidos";resetNav();await load();window.scrollTo(0,0);
  });
  /* créditos y gift cards */
  g("#addc",()=>{S.dep={kind:"credito",method:"saldo",step:1,frz:1,cus:"",phone:"",ref:"",proof:"",busy:false};S.f={};render();window.scrollTo(0,0)});
  g("#inv",()=>{S.inv=!S.inv;render()});
  all("[data-c]",b=>b.onclick=()=>copyTxt(b.dataset.c,b));
  g("#dback",()=>{S.dep=null;S.f={};render()});
  all("[data-q]",b=>b.onclick=()=>{S.dep.frz=+b.dataset.q;S.dep.cus="";render()});
  all("[data-pm]",b=>b.onclick=()=>{S.dep.method=b.dataset.pm;render()});
  const cus=$("#dcus");
  if(cus)cus.oninput=()=>{
    S.dep.cus=cus.value;S.dep.frz=parseFloat(cus.value.replace(",","."))||0;
    $("#sum").innerHTML=sumHTML();
    $("#dnext").disabled=calc(S.dep.frz).f<1;
    all("[data-q]",b=>b.classList.remove("on"));
  };
  g("#dnext",()=>{if(calc(S.dep.frz).f<1)return;S.dep.step=2;S.f={};render();window.scrollTo(0,0)});
  g("#dedit",()=>{S.dep.step=1;render()});
  wire("d",()=>S.dep);
  g("#dsend",async()=>{
    const d=S.dep,gift=d.kind==="gift";if(!checkPay(d.method,d,"d"))return;
    d.busy=true;render();
    const {error}=await SB.rpc(gift?"create_gift_purchase":"create_deposit",{p_frz:calc(d.frz).f,p_phone:d.method==="usdt"?"":d.phone,p_proof:d.proof,p_method:d.method,p_ref:d.ref||""});
    if(error){d.busy=false;setf("d",clean(error.message));return render()}
    S.dep=null;S.tab="billetera";S.f={};
    if(gift){S.gv=true;setf("gift","","✅ Compra enviada. Cuando se acepte, tu código aparece aquí y te llega un aviso.")}
    else{S.gv=false;setf("wal","","✅ Recarga enviada. Está pendiente de revisión.")}
    await load();window.scrollTo(0,0);
  });
  g("#gifts",()=>{S.gv=true;S.f={};render();window.scrollTo(0,0)});
  g("#gback",()=>{S.gv=false;S.f={};render()});
  g("#gbuy",()=>{S.dep={kind:"gift",method:"saldo",step:1,frz:1,cus:"",phone:"",ref:"",proof:"",busy:false};S.f={};render();window.scrollTo(0,0)});
  g("#gredeem",async()=>{
    const code=gv("#gcode").trim();
    if(code.length<6){setf("gift","Escribe el código de tu gift card.");S.f.gcode=code;return render()}
    const {data,error}=await SB.rpc("redeem_gift",{p_code:code});
    if(error){setf("gift",clean(error.message));S.f.gcode=code;return render()}
    if(String(data).startsWith("ok:")){setf("gift","",`✅ ¡Canjeada! Se sumaron ${data.slice(3)} FRZ a tu billetera.`);await load()}
    else{setf("gift",String(data).replace(/^error:/,""));S.f.gcode=code;render()}
  });
  /* admin */
  g("#unlock",()=>{if(gv("#apw")===ADMIN_PW){S.adm=true;S.f={}}else setf("gate","Contraseña incorrecta.");render()});
  g("#tog",async()=>{
    const next=!S.open;
    if(!next&&!confirm("¿Apagar la web? Los clientes verán 'Web en mantenimiento' y solo los administradores podrán entrar."))return;
    const {error}=await SB.rpc("set_site_open",{p_open:next});
    setf("tog",error?clean(error.message):"");
    await loadSettings();render();
  });
  all("[data-s]",b=>b.onclick=()=>{S.asub=b.dataset.s;S.selc=null;S.tmp=null;S.q="";S.fs="all";S.f={};render()});
  all("[data-v]",b=>b.onclick=()=>{S.selc=b.dataset.v;S.tmp=null;S.f={};render()});
  g("#cback",()=>{S.selc=null;S.tmp=null;S.f={};render()});
  const aq=$("#aq");
  if(aq)aq.oninput=()=>{S.q=aq.value;const l=$("#alist");if(l){l.innerHTML=adminList();bind()}};
  all("[data-fs]",b=>b.onclick=()=>{S.fs=b.dataset.fs;render()});
  g("#psave",async()=>{
    let err="",n=0;
    for(const i of document.querySelectorAll("[data-pk]")){
      const k=i.dataset.pk,v=parseFloat(i.value);
      if(!(v>0)){err="Todos los precios deben ser mayores que 0.";break}
      if(v!==P[k]){const {error}=await SB.rpc("set_price",{p_key:k,p_value:v});if(error){err=clean(error.message);break}n++}
    }
    await loadSettings();
    setf("price",err,err?"":(n?`✅ Se guardaron ${n} precio(s).`:"No hay cambios."));render();
  });
  /* roles y precios de revendedor */
  all("[data-rol]",b=>b.onclick=async()=>{
    const [k,id,v]=b.dataset.rol.split(":");
    if(k==="admin"&&v==="1"&&!confirm("¿Dar acceso de administrador a este usuario? Podrá ver y manejar todo."))return;
    await rpcDo(k==="admin"?"set_admin":"set_reseller",{p_user:id,p_ok:v==="1"},"ban");
  });
  g("#rtsave",async()=>{
    await rpcDo("set_rates",{p_user:$("#rtsave").dataset.u,p_saldo:nv(gv("#rrs")),p_banco:nv(gv("#rrb")),p_usdt:nv(gv("#rru"))},"rt");
    setf("rt","","✅ Precios guardados.");render();
  });
  /* juegos y ofertas (admin) */
  g("#gadd",async()=>{
    await rpcDo("save_game",{p_id:null,p_name:gv("#gn"),p_icon:gv("#gi"),p_idlabel:gv("#gl"),p_active:true},"gm");
  });
  const gf=(id,k)=>{const e=document.querySelector(`[data-gf="${id}:${k}"]`);return e?e.value:""};
  all("[data-gsave]",b=>b.onclick=async()=>{const id=+b.dataset.gsave;await rpcDo("save_game",{p_id:id,p_name:gf(id,"name"),p_icon:gf(id,"icon"),p_idlabel:gf(id,"id_label"),p_active:G(id).active},"gm")});
  all("[data-gtog]",b=>b.onclick=async()=>{const id=+b.dataset.gtog,x=G(id);await rpcDo("save_game",{p_id:id,p_name:x.name,p_icon:x.icon,p_idlabel:x.id_label,p_active:!x.active},"gm")});
  all("[data-gdel]",b=>b.onclick=async()=>{if(!confirm("¿Borrar este juego y todas sus ofertas?"))return;await rpcDo("delete_game",{p_id:+b.dataset.gdel},"gm")});
  const of=(id,k)=>{const e=document.querySelector(`[data-of="${id}:${k}"]`);return e?e.value:""};
  const offArgs=(id,act)=>{const x=O(id);return{p_id:id,p_game:x.game_id,p_label:of(id,"label"),p_frz:nv(of(id,"frz")),p_ds:nv(of(id,"direct_saldo")),p_db:nv(of(id,"direct_banco")),p_du:nv(of(id,"direct_usdt")),p_active:act}};
  all("[data-osave]",b=>b.onclick=async()=>{const id=+b.dataset.osave;await rpcDo("save_offer",offArgs(id,O(id).active),"gm")});
  all("[data-otog]",b=>b.onclick=async()=>{const id=+b.dataset.otog;await rpcDo("save_offer",offArgs(id,!O(id).active),"gm")});
  all("[data-odel]",b=>b.onclick=async()=>{if(!confirm("¿Borrar esta oferta?"))return;await rpcDo("delete_offer",{p_id:+b.dataset.odel},"gm")});
  all("[data-oadd]",b=>b.onclick=async()=>{
    const id=+b.dataset.oadd;
    await rpcDo("save_offer",{p_id:null,p_game:id,p_label:gv("#nl"+id),p_frz:nv(gv("#nf"+id)),p_ds:nv(gv("#ns"+id)),p_db:nv(gv("#nb"+id)),p_du:nv(gv("#nu"+id)),p_active:true},"gm");
  });
  all("[data-pro]",b=>b.onclick=async()=>{
    const [k,id]=b.dataset.pro.split(":");
    b.disabled=true;
    const {error}=await SB.rpc("set_processing",{p_kind:k,p_id:+id});
    setf("adm",error?clean(error.message):"");await load();
  });
  all("[data-ver]",b=>b.onclick=async()=>{
    const {error}=await SB.rpc("set_verified",{p_user:b.dataset.ver,p_ok:b.dataset.vb==="1"});
    setf("ban",error?clean(error.message):"");await load();
  });
  all("[data-rst]",b=>b.onclick=async()=>{
    if(!confirm("¿Restablecer la contraseña de este cliente? Se genera una temporal."))return;
    const {data,error}=await SB.rpc("admin_reset_password",{p_user:b.dataset.rst});
    if(error)setf("ban",clean(error.message));else{S.tmp={id:b.dataset.rst,pw:data};setf("ban")}
    await load();
  });
  g("#gcreate",async()=>{
    const am=parseFloat(gv("#gam")),q=Math.floor(+gv("#gqty")||1),nt=gv("#gnote").trim();
    S.f.gam=gv("#gam");S.f.gqty=String(q);S.f.gnote=nt;
    if(!(am>0)){setf("gnew","Escribe el valor en FRZ.");return render()}
    if(q<1||q>50){setf("gnew","La cantidad va de 1 a 50.");return render()}
    const {data,error}=await SB.rpc("create_gifts",{p_frz:am,p_qty:q,p_note:nt});
    if(error){setf("gnew",clean(error.message));return render()}
    S.newCodes=data||[];S.f.gam="";S.f.gnote="";setf("gnew","",`Creaste ${S.newCodes.length} gift card(s) de ${N(am)} FRZ.`);
    await load();
  });
  all("[data-void]",b=>b.onclick=async()=>{
    if(!confirm("¿Anular esta gift card? Ya no se podrá canjear."))return;
    const {error}=await SB.rpc("void_gift",{p_id:+b.dataset.void});
    setf("adm",error?clean(error.message):"");await load();
  });
  all("[data-pf]",b=>b.onclick=async()=>{
    const id=b.dataset.pf,{data,error}=await SB.from("deposits").select("proof").eq("id",id).single();
    if(error||!data){setf("adm","No se pudo cargar la imagen.")}else{S.proofs[id]=data.proof;setf("adm")}
    render();
  });
  all("[data-da]",b=>b.onclick=async()=>{
    b.disabled=true;
    const {error}=await SB.rpc("resolve_deposit",{p_id:+b.dataset.da,p_accept:true,p_msg:""});
    setf("adm",error?clean(error.message):"");await load();
  });
  all("[data-dr2]",b=>b.onclick=async()=>{
    const m=document.querySelector(`[data-dm2="${b.dataset.dr2}"]`).value.trim();
    b.disabled=true;
    const {error}=await SB.rpc("resolve_deposit",{p_id:+b.dataset.dr2,p_accept:false,p_msg:m});
    setf("adm",error?clean(error.message):"");await load();
  });
  all("[data-ban]",b=>b.onclick=async()=>{
    const ban=b.dataset.b==="1";
    if(ban&&!confirm("¿Banear a este cliente?"))return;
    const {error}=await SB.rpc("set_ban",{p_user:b.dataset.ban,p_ban:ban});
    setf("ban",error?clean(error.message):"");await load();
  });
  g("#nsend",async()=>{
    const t=gv("#nmsg").trim();
    if(!t){setf("note","Escribe un mensaje.");return render()}
    const {error}=await SB.rpc("send_notification",{p_user:$("#nsend").dataset.u,p_text:t});
    if(error)setf("note",clean(error.message));else setf("note","","Mensaje enviado.");
    render();
  });
  g("#send",async()=>{
    const em=gv("#aem").trim(),am=parseFloat(gv("#aam"));
    if(!em||!(am>0)){setf("send","Completa correo y cantidad.");return render()}
    const {error}=await SB.rpc("send_frz",{p_email:em,p_amount:am});
    if(error)setf("send",clean(error.message));else setf("send","",`Enviaste ${N(am)} FRZ a ${em}.`);
    await load();
  });
  g("#rmv",async()=>{
    const em=gv("#rem").trim(),am=parseFloat(gv("#ram"));
    if(!em||!(am>0)){setf("rmv","Completa correo y cantidad.");return render()}
    const {error}=await SB.rpc("remove_frz",{p_email:em,p_amount:am});
    if(error)setf("rmv",clean(error.message));else setf("rmv","",`Quitaste ${N(am)} FRZ a ${em}.`);
    await load();
  });
  all("[data-a]",b=>b.onclick=async()=>{await SB.rpc("resolve_order",{p_id:+b.dataset.a,p_accept:true,p_msg:""});load()});
  all("[data-r]",b=>b.onclick=async()=>{
    const m=document.querySelector(`[data-m="${b.dataset.r}"]`).value.trim();
    await SB.rpc("resolve_order",{p_id:+b.dataset.r,p_accept:false,p_msg:m});load();
  });
}
init();
</script></body></html>
