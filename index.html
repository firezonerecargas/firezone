  if(m==="saldo")h+=`<div class="mu">Número de destino</div><div class="row"><div class="big" style="font-size:28px">${esc(PAY.saldo)}</div><button class="cp" data-c="${esc(PAY.saldo)}">Copiar</button></div>`;
  if(m==="banco")h+=`<div class="mu">Tarjeta Bandec</div><div class="row"><div class="big" style="font-size:22px">${esc(cardShow(PAY.card))}</div><button class="cp" data-c="${esc(PAY.card)}">Copiar</button></div><div class="mu" style="margin-top:8px">Móvil a confirmar</div><div class="row"><div class="big" style="font-size:28px">${esc(PAY.confirm)}</div><button class="cp" data-c="${esc(PAY.confirm)}">Copiar</button></div>`;
  if(m==="usdt")h+=`<div class="mu">Red</div><div><b>USDT (BEP20)</b></div><div class="mu" style="margin-top:8px">Dirección de billetera</div><div class="code" style="font-size:14px;word-break:break-all">${esc(PAY.wallet)}</div><button class="cp" data-c="${esc(PAY.wallet)}" style="margin-top:8px">Copiar dirección</button><div class="err" style="margin-top:8px">⚠️ Envía solo USDT por la red BEP20 (BNB Smart Chain). Otra red puede hacerte perder los fondos.</div>`;
  return h+`</div>`;
}
function identCard(m,o,p){
  if(m==="usdt")return`<div class="card"><b>Identifica tu transferencia</b><div class="mu">Hash de la transacción (TXID). Es opcional, pero ayuda a ubicar tu pago.</div><input id="${p}ref" maxlength="100" placeholder="0x..." value="${esc(o.ref)}"></div>`;
  return`<div class="card"><b>Identifica tu transferencia</b><div class="mu">Número desde el que transferiste</div><div class="row" style="gap:8px"><b>+53</b><input id="${p}ph" inputmode="numeric" maxlength="8" placeholder="5XXXXXXX" value="${esc(o.phone)}"></div><div class="mu">Usaremos este número para localizar tu pago.</div></div>`;
}
function proofCard(o,p){
  return`<div class="card bonus"><b>🕒 Revisión manual</b><div class="mu">Te avisaremos cuando se confirme el pago. Puede tardar hasta 10 minutos.</div></div><div class="card"><b>Comprobante de pago</b><div class="mu">Adjunta una imagen de la transferencia. Agiliza la revisión.</div><input type="file" id="${p}file" accept="image/*" hidden>${o.proof?`<img src="${o.proof}" style="max-width:100%;border-radius:12px;margin:8px 0">`:""}<button class="pick" id="${p}pick" style="margin-top:8px">📷 ${o.proof?"Cambiar imagen":"Adjuntar imagen"}</button></div>`;
}
function wire(p,get){
  const ph=$("#"+p+"ph");if(ph)ph.oninput=()=>{get().phone=ph.value.replace(/\D/g,"").slice(0,8);ph.value=get().phone};
  const rf=$("#"+p+"ref");if(rf)rf.oninput=()=>{get().ref=rf.value.slice(0,100)};
  const pk=$("#"+p+"pick");if(pk)pk.onclick=()=>$("#"+p+"file").click();
  const fi=$("#"+p+"file");
  if(fi)fi.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{get().proof=await compress(f);setf(p)}catch(x){setf(p,"No se pudo leer la imagen. Prueba con otra captura.")}render()};
}
function checkPay(m,o,key){
  if(m!=="usdt"&&!/^\d{8}$/.test(o.phone)){setf(key,"Escribe el número desde el que transferiste (8 dígitos).");render();return false}
  if(!o.proof){setf(key,"Adjunta la imagen de la transferencia.");render();return false}
  return true;
}

  let h=`<h2>⭐ Opiniones${ap.length?` · ${avg.toFixed(1)} (${ap.length})`:""}</h2>`;
